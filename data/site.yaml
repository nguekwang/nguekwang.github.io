# Site-wide settings and profile (values that do not depend on the language).
# Page text for each language lives in data/i18n/<code>.yaml.
# Edit the data, open a pull request, and GitHub Actions checks it; after merge it builds and deploys the site.

url: https://nguekwang.github.io
email: nguekwang@gmail.com
github: https://github.com/nguekwang
# Source repository. The "last updated" footer links to {repo}/commit/<sha>.
repo: https://github.com/nguekwang/nguekwang.github.io
goatcounter: https://nguekwang.goatcounter.com/count
copyright_from: 2023
# File name of the CV (PDF) built for each language at /<lang>/<cv_file>.
cv_file: yoshihiro-matsuura-cv.pdf

# Other profiles of the same person, listed as `sameAs` in the structured data (JSON-LD)
# so that search engines and AI assistants can tell these accounts belong to one person.
# Add the ORCID iD URL (https://orcid.org/0000-...) and researchmap URL once they exist.
same_as:
  - https://github.com/nguekwang

# Search engine ownership checks (public tokens, safe to commit). Leave empty until needed.
# Google Search Console: "HTML tag" method, the value of content="..." only.
# Bing Webmaster Tools: "HTML Meta Tag" method (msvalidate.01), the value of content="..." only.
verification:
  google: ""
  bing: ""

# Language order (as shown in the language menu).
# To add a language, copy data/i18n/en.yaml to data/i18n/<code>.yaml, translate every value, and add the code here.
languages: [en, ja, es, fr, ru, zh-Hans, zh-Hant, ar, ko, vi, de, pt, it, nl, tr, id, th, hi, fa, pl, uk]

# Digits used in the "last updated" date for languages that do not write it with 0-9.
digits:
  fa: "۰۱۲۳۴۵۶۷۸۹"

# Keywords, shown in groups (display order). Each group id needs a label under
# `keyword_groups:` and each keyword id a translation under `keywords:` in every
# data/i18n/<code>.yaml.
keywords:
  - group: comparison
    items: [similarity, typology, phylogenetic]
  - group: theory
    items: [saussurean, phonology, morphology, syntax, formal-semantics, generative, cognitive, wittgenstein]
  - group: math
    items: [computational, information-theory, probability, vibrations-waves, signal-processing, data-viz]
  - group: objects
    items: [romance, medieval-castilian, mozarabic, ladino, writing-systems, morse, sign-languages, constructed, formal-languages]
  - group: tech
    items: [i18n, input-methods, typesetting, linux, oss]

name:
  latin: Yoshihiro (Yoshi) MATSUURA
  latin_short: Yoshihiro MATSUURA
  ja: 松浦 義広
  given: Yoshihiro
  family: Matsuura
  nickname: Yoshi

# Facts used only in the structured data (JSON-LD) that search engines and AI assistants read.
knows_language: [ja, en, es]
alumni_of:
  name: The University of Osaka
  alternate_name: 大阪大学
  url: https://www.osaka-u.ac.jp/en

translation_request:
  subject: "[REQUEST] Additional Language Support"
  body: "Please add the following language to your research website: "
