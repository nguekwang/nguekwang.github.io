# Public repository and license of each project (language-independent).
# Keys are the project names used under `projects:` in data/i18n/<code>.yaml (the same in every language).
# Leave `repo` empty while a project has no public repository: the site then shows only its name and description.
# With `repo` set, the name links to the repository and the license (an SPDX id such as MIT,
# see https://spdx.org/licenses/) is shown, linked to the LICENSE file on the default branch.
projects:
  linguasim: {repo: "", license: ""}
  Languer Map: {repo: "", license: ""}
  phrase-marker-gen: {repo: "", license: ""}
  Corpus Hub: {repo: "", license: ""}
