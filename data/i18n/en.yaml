- name: linguasim
  desc: A Python toolkit for measuring language similarity (in development; planned open-source release)
- name: Languer Map
  desc: 'An interactive atlas of the world''s languages (in development)'
- name: phrase-marker-gen
  desc: A tool for drawing syntax trees in generative grammar (planned)
- name: Corpus Hub
  desc: A hub for collecting and searching language corpora (planned)
outlook:
- name: "Dialect or language"
  desc: "use similarity measures to propose criteria for when a variety counts as a dialect and when as a language"
- name: "Syntactic similarity"
  desc: "measure how close syntax is, alongside sounds and vocabulary, and combine them into one index"
- name: "Second-language learning"
  desc: "test whether languages closer to one's own are easier to learn"
- name: "A GUI tool"
  desc: "build a tool anyone can use to compute similarity, and release it as open source"
