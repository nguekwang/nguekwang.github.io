ai_tools_h: "{project} deposunu harici yapay zekâ hizmetleriyle okuma"
ai_tools_intro: "Bu hizmetler projenin herkese açık GitHub deposunu okur: deponun adresindeki github.com yerine hizmetin adresini yazmanız yeterlidir. Bu hizmetleri ben değil, başkaları işletir ve yalnızca herkese açık depolarla çalışırlar."
ai_tools_repo: "Depo"
ai_tools_groups:
  read: "Yapay zekâ ile okuma"
  diagram: "Diyagramlar"
  browse: "Tarayıcıda kod"
ai_tools_desc:
  gitingest: "Depoyu, bir yapay zekâ sohbetine yapıştırılabilecek tek bir metinde (özet, dosya ağacı ve dosya içerikleri) toplar."
  gitmcp: "Depoyu uzak bir MCP sunucusuna dönüştürür: bu adresi MCP destekleyen bir yapay zekâ asistanına özel MCP sunucusu olarak ekleyin. Hesap veya API anahtarı gerekmez."
  deepwiki: "Depo için viki tarzında belgeler oluşturur ve depoyla ilgili soruları yanıtlar."
  uithub: "Dosya ağacını ve dosya içeriklerini bir yapay zekâ asistanı için düz metin olarak gösterir."
  gitreverse: "Bir yapay zekâ kodlama asistanı için projenin istemini ve doğal dilde belirtimini yazar."
  gitdiagram: "Deponun yapısını etkileşimli bir diyagram olarak çizer."
  github-dev: "Depoyu tarayıcıda bir kod düzenleyicide (VS Code) açar. GitHub tarafından işletilir; GitHub'a giriş yapmanız gerekir."
outlook:
- name: "Lehçe mi dil mi"
