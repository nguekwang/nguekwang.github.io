- name: "Sözdizimsel benzerlik"
  desc: "sesler ve sözcük dağarcığının yanında sözdizimindeki yakınlığı da ölçmek ve hepsini tek bir endekste birleştirmek"
- name: "İkinci dil edinimi"
  desc: "kişinin kendi diline daha yakın dillerin daha kolay öğrenilip öğrenilmediğini sınamak"
- name: "Grafik arayüzlü bir araç"
