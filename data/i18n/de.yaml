current: "Was Ähnlichkeit ist und wie sich die Eigenschaften einer Sprache objektiv beschreiben lassen. Ich untersuche, ob sich solche Methoden über die gesprochene menschliche Sprache hinaus anwenden lassen: auf geschriebene Sprache, Gebärdensprachen, das, was bei anderen Wesen als dem Homo sapiens als Sprache gelten könnte, Plansprachen und formale Sprachen."
