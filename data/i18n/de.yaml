ai_tools_purpose:
  gitingest: "Als einen Text zum Einfügen in einen KI-Chat ausgeben"
  gitmcp: "Als MCP-Server mit einem KI-Assistenten verbinden"
  deepwiki: "Eine erzeugte Erklärung lesen und Fragen stellen"
