interests:
- 'Sprachuniversalien und Typologie: was alle menschlichen Sprachen gemeinsam haben und worin sie sich unterscheiden'
- Sprachübergreifende Semantik, mit formaler Semantik als Theorie und computergestützten Methoden als Werkzeug
- Messung der Ähnlichkeit zwischen Sprachen und Dialekten (Phonologie, Lexikon)
- Computerlinguistik und phylogenetische Linguistik
- Schriftsysteme und mehrsprachige Informatik (Eingabemethoden, Internationalisierung)
