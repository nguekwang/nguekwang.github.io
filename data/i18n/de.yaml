ai_tools_desc:
  gitingest: "Fasst das Repository zu einem einzigen Text (Übersicht, Dateibaum und Dateiinhalte) zusammen, der sich in einen KI-Chat einfügen lässt."
  gitmcp: "Macht das Repository zu einem entfernten MCP-Server: Fügen Sie die verlinkte URL in einem KI-Assistenten mit MCP-Unterstützung als benutzerdefinierten MCP-Server hinzu. Konto oder API-Schlüssel sind nicht nötig."
  deepwiki: "Erstellt eine Dokumentation des Repositorys im Stil eines Wikis und beantwortet Fragen dazu."
  uithub: "Zeigt den Dateibaum und die Dateiinhalte als reinen Text für einen KI-Assistenten."
  gitreverse: "Schreibt einen Prompt und eine Spezifikation des Projekts in natürlicher Sprache für einen KI-Programmierassistenten."
  gitdiagram: "Stellt die Struktur des Repositorys als interaktives Diagramm dar."
  github-dev: "Öffnet das Repository in einem Code-Editor (VS Code) im Browser. Betrieben von GitHub; eine Anmeldung bei GitHub ist erforderlich."
outlook:
- name: "Dialekt oder Sprache"
  desc: "auf Grundlage von Ähnlichkeitsmaßen Kriterien vorschlagen, wann eine Varietät als Dialekt und wann als Sprache gilt"
- name: "Syntaktische Ähnlichkeit"
  desc: "neben Lauten und Wortschatz auch die Nähe der Syntax messen und alles zu einem Index zusammenführen"
- name: "Zweitspracherwerb"
  desc: "prüfen, ob Sprachen, die der eigenen näher sind, leichter zu lernen sind"
- name: "Ein GUI-Werkzeug"
  desc: "ein Werkzeug bauen, mit dem jede und jeder Ähnlichkeit berechnen kann"
