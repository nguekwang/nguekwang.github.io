  gitreverse: "Viết prompt và bản đặc tả dự án bằng ngôn ngữ tự nhiên cho trợ lý lập trình AI."
  gitdiagram: "Vẽ cấu trúc của kho mã thành sơ đồ tương tác."
  github-dev: "Mở kho mã trong trình soạn thảo mã (VS Code) trên trình duyệt. Do GitHub vận hành; cần đăng nhập GitHub."
outlook:
