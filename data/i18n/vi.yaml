ai_tools_h: "Liên kết dành cho trợ lý AI"
ai_tools_intro: "Các dịch vụ dưới đây đọc kho mã GitHub công khai của dự án: chỉ cần thay github.com trong URL của kho mã bằng địa chỉ của dịch vụ. Các dịch vụ này do bên thứ ba vận hành, không phải tôi, và chỉ hoạt động với kho mã công khai."
ai_tools_repo: "Kho mã"
