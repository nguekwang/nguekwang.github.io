  gitingest: "Gộp kho mã thành một văn bản duy nhất (tóm tắt, cây tệp và nội dung tệp) để dán vào cuộc trò chuyện với AI."
  gitmcp: "Biến kho mã thành một máy chủ MCP từ xa: thêm URL này làm máy chủ MCP tùy chỉnh trong trợ lý AI có hỗ trợ MCP. Không cần tài khoản hay khóa API."
