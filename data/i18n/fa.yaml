interests:
- 'همگانی‌های زبان و رده‌شناسی: آنچه همهٔ زبان‌های بشری در آن مشترک‌اند و تفاوت‌هایشان'
- معناشناسی میان‌زبانی، با معناشناسی صوری به‌عنوان نظریه و روش‌های محاسباتی به‌عنوان ابزار
- سنجش شباهت میان زبان‌ها و گویش‌ها (واج‌شناسی، واژگان)
- زبان‌شناسی محاسباتی و تبارشناختی
- نظام‌های نوشتاری و رایانش چندزبانه (روش‌های ورودی، بین‌المللی‌سازی)
projects:
- name: linguasim
  desc: مجموعه‌ابزار Python برای سنجش شباهت زبان‌ها (در دست توسعه؛ انتشار متن‌باز در برنامه است)
- name: Languer Map
  desc: اطلس تعاملی زبان‌های جهان (در دست توسعه)
- name: phrase-marker-gen
  desc: ابزاری برای رسم درخت‌های نحوی در دستور زایشی (در مرحلهٔ طرح)
- name: Corpus Hub
  desc: مرکزی برای گردآوری و جست‌وجوی پیکره‌های زبانی (در مرحلهٔ طرح)
outlook:
- name: "گویش یا زبان"
  desc: "پیشنهاد معیارهایی بر پایهٔ سنجه‌های شباهت برای اینکه یک گونهٔ زبانی کی گویش و کی زبان شمرده شود"
- name: "شباهت نحوی"
  desc: "سنجش نزدیکی نحو در کنار آواها و واژگان، و ترکیب آن‌ها در یک شاخص"
- name: "یادگیری زبان دوم"
  desc: "بررسی اینکه آیا زبان‌های نزدیک‌تر به زبان مادری آسان‌تر یاد گرفته می‌شوند"
- name: "ابزار با رابط گرافیکی"
  desc: "ساخت ابزاری که هر کسی بتواند با آن شباهت را محاسبه کند، و انتشار آن به‌صورت متن‌باز"
