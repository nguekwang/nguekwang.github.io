current: سنجش کمّی شباهت میان زبان‌ها. با استفاده از سیاههٔ واج‌ها (PHOIBLE) و داده‌های واژگانی، میزان نزدیکی زبان‌ها و گویش‌ها را می‌سنجم و از زبان‌های رومیایی آغاز می‌کنم. هدف، معیاری است که برای زبان‌های بسیاری کار کند، بر آمار صریح استوار باشد و نشان دهد گویش کجا پایان می‌یابد و زبان کجا آغاز می‌شود.
