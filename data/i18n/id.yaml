- name: "Pemerolehan bahasa kedua"
  desc: "menguji apakah bahasa yang lebih dekat dengan bahasa sendiri lebih mudah dipelajari"
- name: "Alat berbasis GUI"
  desc: "membuat alat yang dapat dipakai siapa saja untuk menghitung kemiripan"
