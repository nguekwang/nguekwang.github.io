current: "Apa itu kemiripan, dan bagaimana sifat-sifat suatu bahasa dapat dideskripsikan secara objektif. Saya menjajaki kemungkinan menerapkan metode tersebut di luar bahasa lisan manusia: pada bahasa tulis, bahasa isyarat, apa yang mungkin dapat disebut bahasa pada entitas selain Homo sapiens, bahasa buatan, dan bahasa formal."
