outlook:
- name: "方言与语言的界线"
  desc: "依据相似度指标，提出把某一语言变体称为方言还是语言的标准"
- name: "句法相似度"
  desc: "在语音和词汇之外也测量句法的接近程度，并合成为一个综合指标"
- name: "第二语言习得的应用"
  desc: "检验与母语越接近的语言是否越容易学习"
- name: "图形界面工具"
  desc: "开发人人都能计算相似度的工具，并以开源形式发布"
