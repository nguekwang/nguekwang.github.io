interests:
- 语言共性与类型学：所有人类语言的共同点与差异
- 跨语言语义学：以形式语义学为理论，以计算方法为工具
- 语言与方言之间相似度的测量（音系、词汇）
- 计算语言学与系统发生语言学
- 文字系统与多语言计算（输入法、国际化）
