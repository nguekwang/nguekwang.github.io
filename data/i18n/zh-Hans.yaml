current: 跨语言相似度的量化。我利用音位清单（PHOIBLE）和词汇数据测量语言与方言之间的距离，首先从罗曼语族入手。目标是建立一个适用于多种语言、基于明确统计方法、并能为“方言与语言的界线在哪里”提供依据的度量。
