interests:
- 'Taaluniversalia en typologie: wat alle menselijke talen gemeen hebben en waarin ze verschillen'
- Taaloverstijgende semantiek, met formele semantiek als theorie en computationele methoden als gereedschap
- Het meten van overeenkomst tussen talen en dialecten (fonologie, lexicon)
- Computationele en fylogenetische taalkunde
- Schriftsystemen en meertalige informatica (invoermethoden, internationalisering)
