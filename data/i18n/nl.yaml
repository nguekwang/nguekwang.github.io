  desc: Interactieve atlas van de talen van de wereld (in ontwikkeling)
- name: phrase-marker-gen
  desc: Tool voor het tekenen van syntaxisbomen in de generatieve grammatica (gepland)
- name: Corpus Hub
  desc: Platform voor het verzamelen en doorzoeken van taalcorpora (gepland)
