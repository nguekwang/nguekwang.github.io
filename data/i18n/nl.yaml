- name: "Syntactische gelijkenis"
  desc: "naast klanken en woordenschat ook de nabijheid van de syntaxis meten en alles samenvoegen tot één index"
- name: "Tweedetaalverwerving"
  desc: "nagaan of talen die dichter bij de eigen taal liggen makkelijker te leren zijn"
