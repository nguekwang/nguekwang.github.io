interests:
- 'Языковые универсалии и типология: что объединяет все человеческие языки и чем они различаются'
- 'Межъязыковая семантика: формальная семантика как теория, вычислительные методы как инструменты'
- Измерение сходства между языками и диалектами (фонология, лексика)
- Компьютерная и филогенетическая лингвистика
- Системы письма и многоязычные вычисления (методы ввода, интернационализация)
projects:
- name: linguasim
  desc: Набор инструментов на Python для измерения сходства языков (в разработке; планируется открытый исходный код)
- name: Languer Map
  desc: Интерактивный атлас языков мира (в разработке)
- name: phrase-marker-gen
  desc: Инструмент для построения синтаксических деревьев генеративной грамматики (в планах)
- name: Corpus Hub
  desc: Платформа для сбора языковых корпусов и поиска по ним (в планах)
outlook:
- name: "Диалект или язык"
  desc: "на основе мер сходства предложить критерии, когда вариант считать диалектом, а когда языком"
- name: "Синтаксическое сходство"
  desc: "измерять близость синтаксиса наряду со звуками и лексикой и объединить всё в один индекс"
- name: "Усвоение второго языка"
  desc: "проверить, легче ли изучать языки, более близкие к родному"
- name: "Инструмент с графическим интерфейсом"
  desc: "создать инструмент, с помощью которого любой сможет вычислить сходство, и опубликовать его с открытым исходным кодом"
