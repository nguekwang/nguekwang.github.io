current: Количественная оценка сходства языков. На основе фонемных инвентарей (PHOIBLE) и лексических данных я измеряю близость языков и диалектов, начиная с романских языков. Цель — мера, применимая ко многим языкам, опирающаяся на явную статистику и помогающая понять, где кончается диалект и начинается язык.
