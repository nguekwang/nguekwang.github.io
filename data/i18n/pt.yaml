interests:
- 'Universais linguísticos e tipologia: o que todas as línguas humanas compartilham e como diferem'
- Semântica interlinguística, com a semântica formal como teoria e os métodos computacionais como ferramentas
- Medição da semelhança entre línguas e dialetos (fonologia, léxico)
- Linguística computacional e filogenética
- Sistemas de escrita e computação multilíngue (métodos de entrada, internacionalização)
projects:
- name: linguasim
  desc: Conjunto de ferramentas em Python para medir a semelhança entre línguas (em desenvolvimento; publicação em código aberto prevista)
- name: Languer Map
  desc: Atlas interativo das línguas do mundo (em desenvolvimento)
- name: phrase-marker-gen
  desc: Ferramenta para desenhar árvores sintáticas da gramática gerativa (em planejamento)
- name: Corpus Hub
  desc: Plataforma para reunir e consultar corpora linguísticos (em planejamento)
outlook:
- name: "Dialeto ou língua"
  desc: "propor, com base em medidas de similaridade, critérios para decidir quando uma variedade é um dialeto e quando é uma língua"
- name: "Similaridade sintática"
  desc: "medir também a proximidade sintática, além dos sons e do léxico, e reuni-las num único índice"
- name: "Aquisição de segunda língua"
  desc: "verificar se as línguas mais próximas da própria são mais fáceis de aprender"
- name: "Uma ferramenta com interface gráfica"
  desc: "criar uma ferramenta com a qual qualquer pessoa possa calcular a similaridade e publicá-la como código aberto"
