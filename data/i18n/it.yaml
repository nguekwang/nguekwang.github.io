interests:
- 'Universali linguistici e tipologia: che cosa hanno in comune tutte le lingue umane e in che cosa differiscono'
- Semantica interlinguistica, con la semantica formale come teoria e i metodi computazionali come strumenti
- Misurazione della somiglianza tra lingue e dialetti (fonologia, lessico)
- Linguistica computazionale e filogenetica
- Sistemi di scrittura e informatica multilingue (metodi di input, internazionalizzazione)
projects:
- name: linguasim
  desc: Toolkit Python per misurare la somiglianza tra lingue (in sviluppo; rilascio open source previsto)
- name: Languer Map
  desc: Atlante interattivo delle lingue del mondo (in sviluppo)
- name: phrase-marker-gen
  desc: Strumento per disegnare alberi sintattici della grammatica generativa (in progetto)
- name: Corpus Hub
  desc: Piattaforma per raccogliere e consultare corpora linguistici (in progetto)
outlook:
- name: "Dialetto o lingua"
  desc: "proporre, sulla base di misure di somiglianza, criteri per stabilire quando una varietà è un dialetto e quando una lingua"
- name: "Somiglianza sintattica"
  desc: "misurare anche la vicinanza sintattica, oltre a suoni e lessico, e riunire tutto in un unico indice"
- name: "Acquisizione della seconda lingua"
  desc: "verificare se le lingue più vicine alla propria sono più facili da imparare"
- name: "Uno strumento con interfaccia grafica"
  desc: "creare uno strumento con cui chiunque possa calcolare la somiglianza e pubblicarlo come open source"
