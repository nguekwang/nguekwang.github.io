interests:
- 'Universaux linguistiques et typologie : ce que partagent toutes les langues humaines et ce qui les distingue'
- Sémantique interlinguistique, avec la sémantique formelle comme théorie et les méthodes computationnelles comme outils
- Mesure de la similarité entre langues et dialectes (phonologie, lexique)
- Linguistique computationnelle et phylogénétique
- Systèmes d'écriture et informatique multilingue (méthodes de saisie, internationalisation)
projects:
- name: linguasim
  desc: Boîte à outils Python pour mesurer la similarité entre langues (en développement ; publication en open source prévue)
- name: Languer Map
  desc: Atlas interactif des langues du monde (en développement)
- name: phrase-marker-gen
  desc: Outil pour dessiner des arbres syntaxiques en grammaire générative (en projet)
- name: Corpus Hub
  desc: Plateforme pour rassembler et interroger des corpus linguistiques (en projet)
outlook:
- name: "Dialecte ou langue"
  desc: "proposer, à partir de mesures de similarité, des critères pour décider quand une variété est un dialecte et quand c'est une langue"
- name: "Similarité syntaxique"
  desc: "mesurer aussi la proximité syntaxique, en plus des sons et du lexique, et réunir le tout en un seul indice"
- name: "Acquisition des langues secondes"
  desc: "vérifier si les langues plus proches de la sienne sont plus faciles à apprendre"
- name: "Un outil graphique"
  desc: "créer un outil permettant à chacun de calculer la similarité, et le publier en open source"
