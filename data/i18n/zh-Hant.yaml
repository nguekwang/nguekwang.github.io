ai_tools_repo: "儲存庫"
ai_tools_groups:
  read: "用 AI 閱讀"
  diagram: "圖表"
  browse: "在瀏覽器中檢視程式碼"
ai_tools_desc:
  gitingest: "將儲存庫整理成一份文字（概要、檔案結構與檔案內容），方便貼到 AI 對話中。"
  gitmcp: "將儲存庫變成遠端 MCP 伺服器：在支援 MCP 的 AI 助理中將此網址新增為自訂 MCP 伺服器即可。不需要帳號或 API 金鑰。"
  deepwiki: "為儲存庫產生維基式文件，並回答關於儲存庫的問題。"
  uithub: "以純文字形式向 AI 助理呈現檔案結構與檔案內容。"
  gitreverse: "為 AI 程式設計助理撰寫專案的提示詞與自然語言規格說明。"
  gitdiagram: "將儲存庫的結構繪製成可互動的圖表。"
  github-dev: "在瀏覽器中的程式碼編輯器（VS Code）開啟儲存庫。由 GitHub 經營，需要登入 GitHub。"
