projects:
- name: linguasim
  desc: ชุดเครื่องมือ Python สำหรับวัดความคล้ายคลึงของภาษา (อยู่ระหว่างพัฒนา มีแผนเผยแพร่แบบโอเพนซอร์ส)
- name: Languer Map
  desc: แผนที่เชิงโต้ตอบของภาษาต่าง ๆ ทั่วโลก (อยู่ระหว่างพัฒนา)
- name: phrase-marker-gen
  desc: เครื่องมือวาดแผนภูมิต้นไม้วากยสัมพันธ์ตามไวยากรณ์เพิ่มพูน (อยู่ในขั้นวางแนวคิด)
- name: Corpus Hub
  desc: ศูนย์รวมสำหรับรวบรวมและค้นหาคลังข้อมูลภาษา (อยู่ในขั้นวางแนวคิด)
outlook:
- name: "ภาษาถิ่นหรือภาษา"
  desc: "เสนอเกณฑ์จากมาตรวัดความคล้ายคลึงว่าเมื่อใดควรเรียกวิธภาษาหนึ่งว่าภาษาถิ่นและเมื่อใดควรเรียกว่าภาษา"
- name: "ความคล้ายคลึงทางวากยสัมพันธ์"
  desc: "วัดความใกล้เคียงทางวากยสัมพันธ์ควบคู่กับเสียงและคำศัพท์ แล้วรวมเป็นดัชนีเดียว"
- name: "การรับภาษาที่สอง"
  desc: "ตรวจสอบว่าภาษาที่ใกล้กับภาษาแม่มากกว่าเรียนได้ง่ายกว่าหรือไม่"
- name: "เครื่องมือแบบ GUI"
  desc: "สร้างเครื่องมือที่ทุกคนใช้คำนวณความคล้ายคลึงได้ และเผยแพร่เป็นโอเพนซอร์ส"
