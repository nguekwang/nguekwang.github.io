current: "Qué es la similitud y cómo pueden describirse de forma objetiva las propiedades de una lengua. Exploro la posibilidad de aplicar estos métodos más allá de la lengua oral humana: a la lengua escrita, las lenguas de signos, lo que podría considerarse lenguaje en seres distintos del Homo sapiens, las lenguas artificiales y los lenguajes formales."
