interests:
- 'Universales lingüísticos y tipología: qué comparten todas las lenguas humanas y en qué se diferencian'
- Semántica interlingüística, con la semántica formal como teoría y los métodos computacionales como herramientas
- Medición de la similitud entre lenguas y dialectos (fonología, léxico)
- Lingüística computacional y filogenética
- Sistemas de escritura y computación multilingüe (métodos de entrada, internacionalización)
projects:
- name: linguasim
  desc: Herramienta en Python para medir la similitud entre lenguas (en desarrollo; se publicará como código abierto)
- name: Lang Log
  desc: Atlas interactivo de las lenguas del mundo, con corpus y datos de lenguas con pocos recursos (en desarrollo)
- name: phrase-marker-gen
  desc: Herramienta para dibujar árboles sintácticos de la gramática generativa (en proyecto)
ai_tools_h: "Lectura del repositorio de {project} con servicios de IA externos"
ai_tools_intro: "Estos servicios leen el repositorio público del proyecto en GitHub: basta con sustituir github.com en la URL del repositorio por la dirección del servicio. Los gestionan terceros, no yo, y solo funcionan con repositorios públicos."
ai_tools_repo: "Repositorio"
ai_tools_groups:
  read: "Lectura con IA"
  diagram: "Diagramas"
  browse: "Código en el navegador"
ai_tools_desc:
  gitingest: "Convierte el repositorio en un único texto (resumen, árbol de archivos y contenido) para pegarlo en un chat de IA."
  gitmcp: "Convierte el repositorio en un servidor MCP remoto: añada esta URL como servidor MCP personalizado en un asistente de IA compatible con MCP. No se necesita cuenta ni clave de API."
  deepwiki: "Genera documentación del repositorio al estilo de una wiki y responde preguntas sobre él."
  uithub: "Muestra el árbol de archivos y su contenido como texto plano para un asistente de IA."
  gitreverse: "Redacta un prompt y una especificación en lenguaje natural del proyecto para un asistente de programación con IA."
  gitdiagram: "Dibuja la estructura del repositorio como un diagrama interactivo."
  github-dev: "Abre el repositorio en un editor de código (VS Code) en el navegador. Lo gestiona GitHub; es necesario iniciar sesión en GitHub."
outlook:
- name: "Dialecto o lengua"
  desc: "proponer, a partir de medidas de similitud, criterios para decidir cuándo una variedad es un dialecto y cuándo una lengua"
- name: "Similitud sintáctica"
  desc: "medir también la cercanía sintáctica, además de la fonológica y la léxica, y combinarlas en un solo índice"
- name: "Adquisición de segundas lenguas"
  desc: "comprobar si las lenguas más cercanas a la propia son más fáciles de aprender"
- name: "Una herramienta con interfaz gráfica"
  desc: "crear una herramienta con la que cualquiera pueda calcular la similitud y publicarla como código abierto"
