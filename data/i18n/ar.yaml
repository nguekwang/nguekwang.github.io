ai_tools_h: "روابط لمساعدي الذكاء الاصطناعي"
ai_tools_intro: "تقرأ هذه الخدمات مستودع GitHub العام لهذا المشروع: يكفي أن تستبدل github.com في عنوان المستودع بعنوان الخدمة. يديرها آخرون لا أنا، ولا تعمل إلا مع المستودعات العامة."
ai_tools_repo: "المستودع"
ai_tools_groups:
  read: "القراءة بالذكاء الاصطناعي"
  diagram: "المخططات"
  browse: "الشيفرة في المتصفح"
ai_tools_desc:
  gitingest: "تجمع المستودع في نص واحد (ملخص وشجرة الملفات ومحتوياتها) يمكن لصقه في محادثة مع الذكاء الاصطناعي."
  gitmcp: "تحوّل المستودع إلى خادم MCP بعيد: أضف هذا العنوان خادمَ MCP مخصصًا في مساعد ذكاء اصطناعي يدعم MCP. لا حاجة إلى حساب أو مفتاح API."
  deepwiki: "تُنشئ توثيقًا للمستودع على هيئة ويكي وتجيب عن الأسئلة المتعلقة به."
  uithub: "تعرض شجرة الملفات ومحتوياتها نصًا عاديًا لمساعد الذكاء الاصطناعي."
  gitreverse: "تكتب موجّهًا ومواصفات للمشروع بلغة طبيعية لمساعد برمجة بالذكاء الاصطناعي."
  gitdiagram: "ترسم بنية المستودع في مخطط تفاعلي."
  github-dev: "تفتح المستودع في محرر شيفرة (VS Code) داخل المتصفح. تديرها GitHub، ويلزم تسجيل الدخول إلى GitHub."
outlook:
- name: "اللهجة واللغة"
  desc: "اقتراح معايير، استنادًا إلى مقاييس التشابه، لتحديد متى يُعدّ التنوع اللغوي لهجةً ومتى يُعدّ لغة"
- name: "التشابه النحوي"
