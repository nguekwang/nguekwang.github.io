#   type      key of `pub_types` in every data/i18n/<code>.yaml (add a new type there for all languages)
#   status    optional key of `pub_status` in every data/i18n/<code>.yaml (e.g. unpublished)
publications:
- title: 言語間の類似度の定量的な算出
  lang: ja
  title_en: A Quantitative Analysis of Cross-Linguistic Similarity
