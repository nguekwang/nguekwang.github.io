# Native speakers who post-edited (reviewed and corrected) a machine-translated language.
#
# - Add a person only after they have agreed to be named, with the name and the one link they chose
#   (social media profile, own website or GitHub). `url` may be left out.
# - This repository is public: never write contact details here (email, phone, address).
#   The owner keeps those outside the repository.
# - Only languages that show a machine-translation notice (mt_notice is not empty) can be listed.
#   On a listed language's pages, the notice changes to `post_edited` with these names.
# - .github/workflows/post-editor-links.yml checks every `url` once a week and emails the owner
#   when one stops working, so the owner can contact that person. It never opens an issue.
#
# Example:
#   post_editors:
#     fr:
#       - name: Jeanne Exemple
#         url: https://github.com/example
post_editors: {}
