# Check the data, build the static site from data/ + templates/, and deploy it to GitHub Pages.
# - Pull requests: check and build only. Fails if any language differs in structure from en.yaml,
#   if unapproved personal information is found (tools/privacy_check.py), or if a link between
#   the site's own pages is broken (tools/check_links.py).
# - Push to main: check, build, and deploy.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the "last updated" footer can find the latest commit that changed the site.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fonts for the CV PDFs (Latin, Cyrillic, Arabic, Devanagari, Thai, CJK); Chrome itself is preinstalled on the runner.
      - name: Install fonts for the CV PDFs
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-core fonts-noto-cjk
      - name: Check that every language has the same items
        run: python3 tools/build.py --check
      - name: Check for personal information the owner has not approved
        run: python3 tools/privacy_check.py
      - name: Build (pages and CV PDFs)
        run: python3 tools/build.py
      - name: Check links between the site's own pages
        run: python3 tools/check_links.py
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
