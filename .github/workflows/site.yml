# Check the data and build the static site from data/ + templates/ for every pull request.
# Fails if any language differs in structure from en.yaml, if unapproved personal information is
# found (tools/privacy_check.py), or if a link between the site's own pages is broken
# (tools/check_links.py).
# For pull requests from this repository (not forks or Dependabot) it also builds a preview of the
# site (tools/build.py --preview: noindex on every page) and uploads it as the artifact "preview".
# .github/workflows/pages.yml publishes it at /preview/pr-<number>/ and links it on the pull request.
# Deploying the live site from main is done by pages.yml, not here.
name: site
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the "last updated" footer can find the latest commit that changed the site.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Fonts for the CV PDFs (Latin, Cyrillic, Arabic, Devanagari, Thai, CJK); Chrome itself is preinstalled on the runner.
      - name: Install fonts for the CV PDFs
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-core fonts-noto-cjk
      - name: Check that every language has the same items
        run: python3 tools/build.py --check
      - name: Check for personal information the owner has not approved
        run: python3 tools/privacy_check.py
      - name: Build (pages and CV PDFs)
        run: python3 tools/build.py
      - name: Check links between the site's own pages
        run: python3 tools/check_links.py
      - name: Build the pull request preview (same pages with noindex, same CV PDFs)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        run: |
          python3 tools/build.py --preview --no-pdf --out=_preview
          (cd _site && find . -name '*.pdf' -exec cp --parents {} ../_preview/ \;)
      - if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: _preview
          # pages.yml publishes every open pull request's latest preview again on each deployment,
          # so keep it for as long as GitHub allows.
          retention-days: 90
