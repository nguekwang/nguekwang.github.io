# Publish the live site to GitHub Pages, built from main. The shared workflow in
# nguekwang/research-aide does the work (rule: research-aide .claude/rules/pr-previews.md).
# Pull request previews are on Cloudflare Pages (previews.yml), not here.
# Requires Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    # One deployment at a time; a newer waiting run replaces an older one, and each run publishes the latest state.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: nguekwang/research-aide/.github/workflows/pages-with-previews.yml@main
    with:
      # Fonts for the CV PDFs (Latin, Cyrillic, Arabic, Devanagari, Thai, CJK); Chrome itself is preinstalled on the runner.
      build: |
        pip install -r requirements.txt
        sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends fonts-noto-core fonts-noto-cjk
        python3 tools/build.py --check
        python3 tools/privacy_check.py
        python3 tools/build.py
        python3 tools/check_links.py
        python3 tools/security_check.py
      site-dir: _site
      # Previews are on Cloudflare Pages (previews.yml).
      previews: false
